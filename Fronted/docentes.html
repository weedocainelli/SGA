<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <script src="js/storage.js" defer></script>
        <script src="js/ui.js" defer></script>
        <script src="js/docentes.js" defer></script>
        <title>SGA - Docentes</title>
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">Inicio</a>
                <a href="alumnos.html">Alumnos</a>
                <a href="docentes.html">Docentes</a>
            </nav>
        </header>
        <main>
            <h1>Gestión de Docentes</h1>
            <section class="formulario-container">
                <h2>Alta de Docente</h2>
                <form id="formulario">
                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre">
                    </div>
                    <div class="campo">
                        <label for="materia">Materia</label>
                        <input type="text" id="materia">
                    </div>
                    <div class="campo">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo">
                    </div>
                    <button type="submit">Guardar Docente</button>
                </form>
            </section>
            <section class="lista-container">
                <h2>Docentes registrados</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Materia</th>
                            <th>Correo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="listaDocentes"></tbody>
                </table>
            </section>
            <div id="mensaje" class="mensaje"></div>
        </main>
    </body>
</html>
