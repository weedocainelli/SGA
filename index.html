<!DOCTYPE html>
<html lang="es">

<head>
    <title></title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="JS/alumnos.js" defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Sistema de Gestion Academica</h1>
    </header>
    <main>
        <section class="contenedor">
            <h2>Alta de alumno</h2>
            <form id="formAlumno">

                <label for="nombre">Nombre</label>
                <input type="text" id="nombre"><br><br>

                <label for="carrera">Carrera</label>
                <input type="text" id="carrera"><br><br>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo"><br><br>

                <button type="submit">Guardar alumno</button>
            </form>
        </section>
        <p id="mensaje"></p>
        <h2>Lista de alumnos</h2>
        <p id="cantidadAlumnos"></p>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Carrera</th>
                    <th>Correo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="listaAlumnos"></tbody>
        </table>
        <ul id="listaAlumnos"></ul>
    </main>
</body>

</html>
