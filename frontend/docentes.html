<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/estilos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src="JS/storage.js" defer></script>
    <script src="JS/ui.js" defer></script>
    <script src="JS/docentes.js" defer></script>
    <title>SGA - Docentes</title>
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="alumnos.html">Alumnos</a>
            <a href="docentes.html" class="activo">Docentes</a>
        </nav>
    </header>
    <main>
        <h1>Gestión de Docentes</h1>
        <section class="formulario-container">
            <h2 id="tituloFormularioDocente">Alta de Docente</h2>
            <form id="formDocente">
                <div class="campo">
                    <label for="nombreDocente">Nombre</label>
                    <input type="text" id="nombreDocente" name="nombre" required>
                </div>
                <div class="campo">
                    <label for="especialidadDocente">Especialidad</label>
                    <input type="text" id="especialidadDocente" name="especialidad" required>
                </div>
                <div class="campo">
                    <label for="correoDocente">Correo electrónico</label>
                    <input type="email" id="correoDocente" name="correo" required>
                </div>
                <div class="acciones-form">
                    <button type="submit" id="btnGuardarDocente">Guardar Docente</button>
                    <button type="button" id="btnCancelarDocente" class="btn-cancelar" hidden>Cancelar</button>
                </div>
            </form>
        </section>
        <section class="lista-container">
            <h2>Docentes registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Especialidad</th>
                        <th>Correo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="listaDocentes"></tbody>
            </table>
        </section>
        <div id="mensaje" class="mensaje" role="status" aria-live="polite"></div>
    </main>
</body>
</html>
